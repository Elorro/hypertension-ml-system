[project]
name = "hypertension-ml"
version = "1.0.0"
description = "Sistema end-to-end de clasificación de hipertensión arterial: datos, entrenamiento comparativo, servicio REST y dashboard."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Luis Araque", email = "luisalfredoaraque@gmail.com" }]
keywords = ["machine-learning", "hipertension", "fastapi", "streamlit", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.ruff]
line-length = 110
target-version = "py314"
exclude = [".venv", "notebooks", "data", "models"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "E501",  # longitud de línea gestionada por el formateador
]

[tool.ruff.lint.per-file-ignores]
# El pipeline heredado de la raíz no cumple el estándar todavía. Ver ROADMAP DT-5.
"data_pipeline.py" = ["ALL"]
"train_models.py" = ["ALL"]
"model_utils.py" = ["ALL"]
"streamlit_app.py" = ["ALL"]
"chatbot_cli.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
# -rs: el motivo de cada skip (artefactos o CSV ausentes) queda visible en la salida.
addopts = "-v -rs --strict-markers"
markers = [
    "requires_artifacts: necesita models/dt1_*.pkl (no versionados); se salta si faltan",
    "requires_data: necesita data/real/cardio/cardio_train.csv (no redistribuible); se salta si falta",
]
filterwarnings = [
    # Deprecaciones internas de starlette 1.6 en su TestClient (httpx → httpx2 y un
    # alias de anyio). No afectan al servicio; no se añade httpx2 solo para callarlas.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv", "notebooks"]
