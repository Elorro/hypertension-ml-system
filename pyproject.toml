[project]
name = "hypertension-ml"
version = "1.0.0"
description = "Sistema end-to-end de clasificación de hipertensión arterial: datos, entrenamiento comparativo, servicio REST y dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Luis Araque", email = "luisalfredoaraque@gmail.com" }]
keywords = ["machine-learning", "hipertension", "fastapi", "streamlit", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "notebooks", "data", "models"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "E501",  # longitud de línea gestionada por el formateador
]

[tool.ruff.lint.per-file-ignores]
# El pipeline heredado de la raíz no cumple el estándar todavía. Ver ROADMAP DT-5.
"data_pipeline.py" = ["ALL"]
"train_models.py" = ["ALL"]
"model_utils.py" = ["ALL"]
"streamlit_app.py" = ["ALL"]
"chatbot_cli.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv", "notebooks"]
