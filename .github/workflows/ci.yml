name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # minor de la corrida de referencia de DT-1 (3.14.6); CI no carga los .pkl
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instalar ruff (versión del lock)
        run: pip install "$(grep -E '^ruff==' requirements.lock.txt)"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formato (ruff format --check)
        run: ruff format --check .

  pipeline:
    name: Pipeline end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # minor de la corrida de referencia de DT-1 (3.14.6); CI no carga los .pkl
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instalar dependencias
        run: pip install -r requirements.lock.txt

      - name: Generar dataset sintético
        run: python src/generate_dataset.py

      - name: Auditoría de target leakage
        run: python scripts/verify_leakage.py

      - name: Entrenar modelos
        run: python src/train_classical_models.py

      - name: Verificar que los artefactos existen
        run: |
          test -f models/scaler.pkl
          test -f models/mejor_modelo.txt
          echo "Modelo seleccionado: $(cat models/mejor_modelo.txt)"

      # El servicio ya no usa estos artefactos sintéticos: sirve models/dt1_*.pkl, que
      # no están en git. Aquí solo se comprueba que la app se construye sin ellos; la
      # carga real la cubren los tests de integración (requires_artifacts) en local.
      - name: Verificar que la API se construye sin artefactos
        run: |
          python -c "from api.main import create_app; create_app(cargar_artefactos=False); print('API construida')"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # minor de la corrida de referencia de DT-1 (3.14.6); CI no carga los .pkl
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instalar dependencias
        run: pip install -r requirements.lock.txt

      # Sin .pkl ni CSV en CI: corren los tests de contrato; los de integración se
      # saltan y -rs (pyproject) imprime cada skip con su motivo.
      - name: Ejecutar tests
        run: python -m pytest --cov=src --cov=api --cov-report=term-missing
